<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar Bingo — Cherita & Candyse Birthday Edition</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap');

  :root{
    --ink:#211320;
    --paper:#fdf6ec;
    --gold:#c9972e;
    --gold-deep:#a8781c;
    --berry:#a13356;
    --emerald:#1f6b53;
    --line: rgba(33,19,32,0.85);
    --line-soft: rgba(33,19,32,0.2);
  }

  *{box-sizing:border-box;}
  html{ overflow-x:hidden; }

  body{
    margin:0;
    padding:18px 12px 50px;
    min-height:100vh;
    width:100%;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 10% 6%, rgba(161,51,86,0.10), transparent 40%),
      radial-gradient(circle at 92% 94%, rgba(31,107,83,0.10), transparent 45%),
      var(--paper);
    font-family:'Space Grotesk', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .frame{
    width:100%;
    max-width:520px;
    box-sizing:border-box;
    border:2px solid var(--ink);
    padding:5px;
    position:relative;
    overflow:hidden;
  }
  .frame-inner{
    border:1px solid var(--gold);
    padding:26px 16px 26px;
    position:relative;
    overflow:hidden;
    background:var(--paper);
  }

  .confetti{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:0;
  }

  .glass{
    display:block;
    margin:0 auto 8px;
    width:36px;
    height:36px;
    color:var(--gold-deep);
    position:relative;
    z-index:1;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-style:italic;
    text-align:center;
    font-size:clamp(23px, 6.2vw, 31px);
    line-height:1.08;
    margin:0 0 10px;
    letter-spacing:0.01em;
    color:var(--ink);
    position:relative;
    z-index:1;
  }

  .rule{
    display:flex;
    align-items:center;
    gap:10px;
    max-width:340px;
    margin:0 auto 14px;
    position:relative;
    z-index:1;
  }
  .rule .line{ flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--gold-deep), transparent); }
  .rule .diamond{
    width:7px; height:7px; background:var(--berry);
    transform:rotate(45deg);
    flex-shrink:0;
  }

  .sub{
    text-align:center;
    font-size:12.5px;
    line-height:1.55;
    opacity:0.78;
    max-width:400px;
    margin:0 auto 18px;
    position:relative;
    z-index:1;
  }

  .name-wrap{
    position:relative;
    z-index:1;
    max-width:260px;
    margin:0 auto 6px;
  }

  #name-tag{
    display:block;
    width:100%;
    text-align:center;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line-soft);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    font-size:12.5px;
    letter-spacing:0.03em;
    padding:5px 4px;
    outline:none;
  }
  #name-tag::placeholder{ color:rgba(33,19,32,0.4); }
  #name-tag:focus{ border-bottom-color:var(--berry); }
  #name-tag.needs-name{ border-bottom-color:var(--berry); }

  .name-hint{
    text-align:center;
    font-size:10.5px;
    color:var(--berry);
    margin:0 0 12px;
    min-height:13px;
    opacity:0;
    transition:opacity 0.15s ease;
    position:relative;
    z-index:1;
  }
  .name-hint.show{ opacity:1; }

  .board{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:0;
    border:1px solid var(--ink);
    position:relative;
    z-index:1;
    width:100%;
  }

  .cell{
    position:relative;
    aspect-ratio:1/1;
    border:0.5px solid var(--line-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    background:#fffdf9;
    transition:background 0.2s ease;
    min-width:0;
    overflow:hidden;
  }

  .cell span{
    font-size:clamp(8.5px, 2.35vw, 10.5px);
    line-height:1.28;
    font-weight:500;
    color:var(--ink);
    overflow-wrap:break-word;
    word-break:break-word;
    hyphens:auto;
    max-width:100%;
  }

  .cell.free{ border:1.5px solid var(--gold-deep); background:linear-gradient(150deg, #f3dfa8, var(--gold)); }
  .cell.free span{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:700;
    font-size:clamp(11px,3vw,14px);
    color:var(--ink);
  }

  .cell.marked:not(.free){ background:var(--berry); }
  .cell.marked:not(.free) span{ color:var(--paper); opacity:0.4; }

  .stamp{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .stamp svg{ width:56%; height:56%; }
  .cell.marked:not(.free) .stamp{ opacity:0.95; }

  .footer-row{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:18px;
    gap:10px;
    position:relative;
    z-index:1;
  }

  .status{ font-size:11.5px; opacity:0.7; }

  .btn-row{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:12px;
    position:relative;
    z-index:1;
  }

  button.action{
    font-family:'Space Grotesk', sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.02em;
    background:transparent;
    border:1px solid var(--berry);
    color:var(--berry);
    padding:9px 16px;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease, opacity 0.2s ease;
  }
  button.action:hover{ background:var(--berry); color:var(--paper); }

  button.action.primary{
    background:var(--berry);
    color:var(--paper);
    border:1px solid var(--berry);
  }
  button.action.primary:hover{ background:var(--gold-deep); border-color:var(--gold-deep); }
  button.action:disabled{ opacity:0.55; cursor:default; }

  .bingo-banner{
    display:none;
    text-align:center;
    margin-top:20px;
    padding:14px;
    border:1.5px solid var(--berry);
    background:rgba(161,51,86,0.06);
    position:relative;
    z-index:1;
  }
  .bingo-banner.show{ display:block; }
  .bingo-banner p{
    margin:0;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:700;
    font-size:18px;
    color:var(--berry);
  }

  .submit-note{
    text-align:center;
    font-size:10.5px;
    opacity:0.55;
    margin-top:10px;
    position:relative;
    z-index:1;
    min-height:13px;
  }
  .submit-note.success{ color:var(--emerald); opacity:1; font-weight:600; }
  .submit-note.error{ color:var(--berry); opacity:1; font-weight:600; }
</style>
</head>
<body>
<div class="frame">
<div class="frame-inner" id="capture-area">

  <svg class="confetti" viewBox="0 0 500 700" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="30" cy="28" r="4" fill="#a13356" opacity="0.55"/>
    <circle cx="465" cy="40" r="3" fill="#1f6b53" opacity="0.5"/>
    <circle cx="450" cy="80" r="5" fill="#c9972e" opacity="0.5"/>
    <rect x="20" y="60" width="6" height="6" fill="#c9972e" opacity="0.5" transform="rotate(20 23 63)"/>
    <rect x="470" y="15" width="5" height="5" fill="#a13356" opacity="0.45" transform="rotate(35 472 17)"/>
    <circle cx="15" cy="110" r="3" fill="#1f6b53" opacity="0.45"/>
    <circle cx="480" cy="650" r="4" fill="#a13356" opacity="0.45"/>
    <circle cx="25" cy="660" r="3" fill="#c9972e" opacity="0.5"/>
    <rect x="450" y="620" width="6" height="6" fill="#1f6b53" opacity="0.4" transform="rotate(15 453 623)"/>
    <circle cx="470" cy="680" r="3" fill="#c9972e" opacity="0.45"/>
  </svg>

  <svg class="glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M9 3l4 4M15 3l-4 4M12 7v6M8 15c1 1.5 2.5 2 4 2s3-.5 4-2M12 13v6M8.5 19h7"/>
    <path d="M4 5l3.5 3.5M20 5l-3.5 3.5M2 3l3.5 3.5M22 3l-3.5 3.5"/>
  </svg>

  <h1>Bar Bingo — Cherita<br>&amp; Candyse Birthday Edition</h1>

  <div class="rule"><div class="line"></div><div class="diamond"></div><div class="line"></div></div>

  <p class="sub">Talk to someone new — or dig up some ancient history — and cross it off. Five in a row wins a prize.</p>

  <div class="name-wrap">
    <input id="name-tag" type="text" placeholder="Playing as..." maxlength="24">
  </div>
  <p class="name-hint" id="name-hint">Enter your name above before submitting</p>

  <div class="board" id="board"></div>

  <div class="bingo-banner" id="banner"><p>BINGO — go claim your drink</p></div>

  <div class="footer-row">
    <div class="status" id="status">0 marked</div>
  </div>

  <div class="btn-row">
    <button class="action" id="reset">Reset</button>
    <button class="action primary" id="submit">Submit board</button>
  </div>

  <p class="submit-note" id="submit-note">One tap sends a snapshot of your board — nothing to download.</p>

</div>
</div>

<script>
const PROMPTS = [
  "Find someone who shares your zodiac sign",
  "Went to college with ___",
  "Take a photo booth pic",
  "Met ___ at The Gathering Spot",
  "Ask a stranger for their best bar recommendation",
  "Met ___ in the 90s",
  "Take a photo with a stranger",
  "Lived with ___",
  "Start a toast for a total stranger",
  "Worked with ___",
  "Get a stranger to guess your age",
  "Went to high school with ___",
  "Get 3 people to sign a napkin",
  "Been on a trip with ___",
  "Cheers with 5 different people",
  "Met ___ through a mutual friend",
  "Get a compliment from a stranger",
  "Get a stranger to do a shot with you",
  "Find someone who's traveled somewhere you haven't",
  "Known ___ for 10+ years",
  "Get someone to teach you a dance move",
  "Get someone's phone number",
  "Ask someone their go-to karaoke song",
  "Talked ___ into a questionable decision"
];

// ⚠️ Replace this with your real Formspree endpoint before deploying —
// e.g. "https://formspree.io/f/abcdwxyz" — from your Formspree form's dashboard.
const FORMSPREE_ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID";

let deck = [];
let marked = new Set();

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="#fdf6ec" stroke-width="1.6"><path d="M4 13l5 5L20 6"/></svg>`;

function buildBoard(){
  deck = shuffle(PROMPTS).slice(0,24);
  marked = new Set([12]);
  render();
}

function render(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  let idx = 0;
  for(let i=0;i<25;i++){
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(i === 12){
      cell.classList.add('free');
      cell.innerHTML = '<span>FREE<br>Birthday<br>Toast</span>';
      cell.dataset.free = "true";
    } else {
      const text = deck[idx];
      cell.innerHTML = `<span>${text}</span><div class="stamp">${CHECK_SVG}</div>`;
      cell.dataset.index = idx;
      idx++;
    }
    if(marked.has(i)) cell.classList.add('marked');
    cell.addEventListener('click', () => toggle(i, cell));
    board.appendChild(cell);
  }
  updateStatus();
  document.getElementById('banner').classList.remove('show');
}

function toggle(i, cell){
  if(cell.dataset.free) return;
  if(marked.has(i)){ marked.delete(i); cell.classList.remove('marked'); }
  else { marked.add(i); cell.classList.add('marked'); }
  updateStatus();
  checkBingo();
}

function updateStatus(){
  document.getElementById('status').textContent = `${marked.size} of 25 marked`;
}

function checkBingo(){
  const lines = [];
  for(let r=0;r<5;r++) lines.push([0,1,2,3,4].map(c=>r*5+c));
  for(let c=0;c<5;c++) lines.push([0,1,2,3,4].map(r=>r*5+c));
  lines.push([0,6,12,18,24]);
  lines.push([4,8,12,16,20]);
  const won = lines.some(line => line.every(pos => marked.has(pos)));
  document.getElementById('banner').classList.toggle('show', won);
}

document.getElementById('reset').addEventListener('click', () => {
  marked = new Set([12]);
  document.querySelectorAll('.cell').forEach(c => {
    if(c.dataset.free) return;
    c.classList.remove('marked');
  });
  document.getElementById('banner').classList.remove('show');
  updateStatus();
});

const nameInput = document.getElementById('name-tag');
const nameHint = document.getElementById('name-hint');
nameInput.addEventListener('input', () => {
  if(nameInput.value.trim()){
    nameInput.classList.remove('needs-name');
    nameHint.classList.remove('show');
  }
});

const submitBtn = document.getElementById('submit');
const submitNote = document.getElementById('submit-note');

submitBtn.addEventListener('click', async () => {
  const nameVal = nameInput.value.trim();
  if(!nameVal){
    nameInput.classList.add('needs-name');
    nameHint.classList.add('show');
    nameInput.focus();
    return;
  }

  submitBtn.disabled = true;
  const originalLabel = submitBtn.textContent;
  submitBtn.textContent = "Sending...";
  submitNote.className = "submit-note";
  submitNote.textContent = "Capturing your board...";

  try{
    const target = document.getElementById('capture-area');
    const canvas = await html2canvas(target, {
      backgroundColor: "#fdf6ec",
      scale: 2,
      useCORS: true
    });

    canvas.toBlob(async (blob) => {
      const fileName = `bingo-${nameVal.replace(/\s+/g, "-").toLowerCase()}.png`;
      const formData = new FormData();
      formData.append("name", nameVal);
      formData.append("squares_marked", `${marked.size} of 25`);
      formData.append("board_snapshot", blob, fileName);

      try{
        const response = await fetch(FORMSPREE_ENDPOINT, {
          method: "POST",
          body: formData,
          headers: { "Accept": "application/json" }
        });

        if(response.ok){
          submitNote.className = "submit-note success";
          submitNote.textContent = "Sent! Your board is on its way to Cherita.";
        } else {
          throw new Error("Formspree responded with an error");
        }
      }catch(sendErr){
        submitNote.className = "submit-note error";
        submitNote.textContent = "Couldn't send — check your connection and try again.";
      }

      submitBtn.disabled = false;
      submitBtn.textContent = originalLabel;
    }, "image/png");

  }catch(err){
    submitBtn.disabled = false;
    submitBtn.textContent = originalLabel;
    submitNote.className = "submit-note error";
    submitNote.textContent = "Couldn't capture the board — try again.";
  }
});

buildBoard();
</script>
</body>
</html>
