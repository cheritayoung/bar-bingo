<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar Bingo — Cherita & Candyse Birthday Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap');

  :root{
    --ink:#1a1a1a;
    --paper:#faf7f0;
    --line: rgba(26,26,26,0.85);
    --line-soft: rgba(26,26,26,0.22);
    --mark:#1a1a1a;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    padding:18px 12px 50px;
    min-height:100vh;
    background:var(--paper);
    font-family:'Space Grotesk', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .frame{
    width:100%;
    max-width:520px;
    border:2px solid var(--ink);
    padding:5px;
  }
  .frame-inner{
    border:1px solid var(--ink);
    padding:22px 16px 26px;
  }

  .glass{
    display:block;
    margin:0 auto 8px;
    width:34px;
    height:34px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-style:italic;
    text-align:center;
    font-size:clamp(24px, 6.5vw, 32px);
    line-height:1.05;
    margin:0 0 10px;
    letter-spacing:0.01em;
  }

  .rule{
    display:flex;
    align-items:center;
    gap:10px;
    max-width:340px;
    margin:0 auto 14px;
  }
  .rule .line{ flex:1; height:1px; background:var(--line); }
  .rule .diamond{
    width:6px; height:6px; background:var(--ink); transform:rotate(45deg);
  }

  .sub{
    text-align:center;
    font-size:12.5px;
    line-height:1.55;
    opacity:0.75;
    max-width:400px;
    margin:0 auto 18px;
  }

  #name-tag{
    display:block;
    width:100%;
    max-width:260px;
    margin:0 auto 18px;
    text-align:center;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line-soft);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    font-size:12.5px;
    letter-spacing:0.03em;
    padding:5px 4px;
    outline:none;
  }
  #name-tag::placeholder{ color:rgba(26,26,26,0.4); }
  #name-tag:focus{ border-bottom-color:var(--ink); }

  .board{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:0;
    border:1px solid var(--ink);
  }

  .cell{
    position:relative;
    aspect-ratio:1/1;
    border:0.5px solid var(--line-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    background:var(--paper);
    transition:background 0.2s ease;
  }

  .cell span{
    font-size:clamp(8.5px, 2.35vw, 10.5px);
    line-height:1.28;
    font-weight:500;
    color:var(--ink);
  }

  .cell.free{ border:1.5px solid var(--ink); }
  .cell.free span{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:700;
    font-size:clamp(11px,3vw,14px);
  }

  .cell.marked{ background:var(--ink); }
  .cell.marked span{ color:var(--paper); opacity:0.35; }
  .cell.marked.free span{ color:var(--ink); opacity:1; }
  .cell.marked.free{ background:var(--paper); }

  .stamp{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .stamp svg{ width:58%; height:58%; }
  .cell.marked:not(.free) .stamp{ opacity:0.9; }

  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    gap:10px;
  }

  .status{ font-size:11.5px; opacity:0.7; }

  .btns{ display:flex; gap:8px; }

  button.action{
    font-family:'Space Grotesk', sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.02em;
    background:transparent;
    border:1px solid var(--ink);
    color:var(--ink);
    padding:8px 13px;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease;
  }
  button.action:hover{ background:var(--ink); color:var(--paper); }

  .bingo-banner{
    display:none;
    text-align:center;
    margin-top:20px;
    padding:14px;
    border:1.5px solid var(--ink);
  }
  .bingo-banner.show{ display:block; }
  .bingo-banner p{
    margin:0;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:700;
    font-size:18px;
  }

  .playing-as{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:22px;
    font-size:12.5px;
  }
  .playing-as svg{ width:16px; height:16px; flex-shrink:0; }
  .playing-as .fill{
    flex:1;
    border-bottom:1px solid var(--line);
    padding-bottom:2px;
    min-height:16px;
  }
</style>
</head>
<body>
<div class="frame">
<div class="frame-inner">

  <svg class="glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M9 3l4 4M15 3l-4 4M12 7v6M8 15c1 1.5 2.5 2 4 2s3-.5 4-2M12 13v6M8.5 19h7"/>
    <path d="M4 5l3.5 3.5M20 5l-3.5 3.5M2 3l3.5 3.5M22 3l-3.5 3.5"/>
  </svg>

  <h1>Bar Bingo — Cherita<br>&amp; Candyse Birthday Edition</h1>

  <div class="rule"><div class="line"></div><div class="diamond"></div><div class="line"></div></div>

  <p class="sub">Talk to someone new — or dig up some ancient history — and cross it off. Five in a row wins a prize.</p>

  <input id="name-tag" type="text" placeholder="Playing as..." maxlength="24">

  <div class="board" id="board"></div>

  <div class="bingo-banner" id="banner"><p>BINGO — go claim your drink</p></div>

  <div class="footer-row">
    <div class="status" id="status">0 marked</div>
    <div class="btns">
      <button class="action" id="shuffle">New board</button>
      <button class="action" id="reset">Reset</button>
    </div>
  </div>

</div>
</div>

<script>
const PROMPTS = [
  "Find someone who shares your zodiac sign",
  "Went to college with ___",
  "Take a photo booth pic",
  "Met ___ at The Gathering Spot",
  "Ask a stranger for their best bar recommendation",
  "Met ___ in the 90s",
  "Take a photo with a stranger",
  "Lived with ___",
  "Start a toast for a total stranger",
  "Worked with ___",
  "Get a stranger to guess your age",
  "Went to high school with ___",
  "Get 3 people to sign a napkin",
  "Been on a trip with ___",
  "Cheers with 5 different people",
  "Met ___ through a mutual friend",
  "Get a compliment from a stranger",
  "Get a stranger to do a shot with you",
  "Find someone who's traveled somewhere you haven't",
  "Known ___ for 10+ years",
  "Get someone to teach you a dance move",
  "Get someone's phone number",
  "Ask someone their go-to karaoke song",
  "Talked ___ into a questionable decision"
];

let deck = [];
let marked = new Set();

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="#faf7f0" stroke-width="1.6"><path d="M4 13l5 5L20 6"/></svg>`;

function buildBoard(){
  deck = shuffle(PROMPTS).slice(0,24);
  marked = new Set([12]);
  render();
}

function render(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  let idx = 0;
  for(let i=0;i<25;i++){
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(i === 12){
      cell.classList.add('free');
      cell.innerHTML = '<span>FREE<br>Birthday<br>Toast</span>';
      cell.dataset.free = "true";
    } else {
      const text = deck[idx];
      cell.innerHTML = `<span>${text}</span><div class="stamp">${CHECK_SVG}</div>`;
      cell.dataset.index = idx;
      idx++;
    }
    if(marked.has(i)) cell.classList.add('marked');
    cell.addEventListener('click', () => toggle(i, cell));
    board.appendChild(cell);
  }
  updateStatus();
  document.getElementById('banner').classList.remove('show');
}

function toggle(i, cell){
  if(cell.dataset.free) return;
  if(marked.has(i)){ marked.delete(i); cell.classList.remove('marked'); }
  else { marked.add(i); cell.classList.add('marked'); }
  updateStatus();
  checkBingo();
}

function updateStatus(){
  document.getElementById('status').textContent = `${marked.size} of 25 marked`;
}

function checkBingo(){
  const lines = [];
  for(let r=0;r<5;r++) lines.push([0,1,2,3,4].map(c=>r*5+c));
  for(let c=0;c<5;c++) lines.push([0,1,2,3,4].map(r=>r*5+c));
  lines.push([0,6,12,18,24]);
  lines.push([4,8,12,16,20]);
  const won = lines.some(line => line.every(pos => marked.has(pos)));
  document.getElementById('banner').classList.toggle('show', won);
}

document.getElementById('shuffle').addEventListener('click', buildBoard);
document.getElementById('reset').addEventListener('click', () => {
  marked = new Set([12]);
  document.querySelectorAll('.cell').forEach(c => {
    if(c.dataset.free) return;
    c.classList.remove('marked');
  });
  document.getElementById('banner').classList.remove('show');
  updateStatus();
});

buildBoard();
</script>
</body>
</html>
